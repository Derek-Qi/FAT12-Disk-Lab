name: FAT12 Lab CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: python tools/verify_project.py
      - run: python tools/compaction_experiment.py
      - run: python -m pip install build
      - run: python -m build --wheel --outdir artifacts/releases
      - run: python tools/check_distribution.py artifacts/releases/fat12_disk_lab-1.2.1-py3-none-any.whl
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm install -g agent-browser@0.39.0
      - name: Use the runner's installed Chrome
        shell: bash
        run: |
          browser_path="$(command -v google-chrome)"
          test -n "$browser_path"
          "$browser_path" --version
          printf 'AGENT_BROWSER_EXECUTABLE_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - run: python tools/check_browser.py
  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pyfatfs==1.1.0 "setuptools<81"
      - run: python tools/check_interop.py
